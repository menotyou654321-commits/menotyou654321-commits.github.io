<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    .split-container {
      display: flex;
      align-items: center;
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .text-side, .image-side {
      flex: 1;
    }
    .image-side img {
      width: 100%;
      height: auto;
    }
    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <div class="text-side">
      <h1>Heading</h1>
      <p>Your text goes here.</p>
    </div>
    <div class="image-side">
      <img src="my-image.jpg" alt="Image">
    </div>
  </div>

</body>
</html>
