<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-image: linear-gradient(180deg, #ff007f, #ff6a00);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .split-container {
      display: flex;
      align-items: center;
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .text-side {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .text-side h1 {
      font-size: 32px;  /* <-- Controls the size of the Heading */
      margin-top: 0;
    }
    .text-side p {
      font-size: 18px;  /* <-- Controls the size of the Paragraph text */
      line-height: 1.5;
    }
    .image-side {
      flex: 1;
    }
    .image-side img {
      width: 100%;
      height: auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }
    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <div class="text-side">
      <h1>Heading</h1>
      <p>JUST WANTED TO SAY HAPPY BIRTHDAY.</p>
      <p>and wish you many more</p>
    </div>
    <div class="image-side">
      <img src="Bday.png" alt="Happy Birthday Art">
    </div>
  </div>

</body>
</html>
