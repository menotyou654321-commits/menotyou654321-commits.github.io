<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-image: linear-gradient(180deg, #ff007f, #ff6a00);
      background-attachment: fixed;
      min-height: 100vh;
    }

    .split-container {
      display: flex;
      align-items: center;
      gap: 100px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .text-side {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.50);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75); 
      text-align: center;
      aspect-ratio:3 / 4; 
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 20px 40px 60px 40px; 
    }
    
    .text-side p:first-of-type {
      font-size: 75px;  
      line-height: 1.1;
      font-weight: bold;
      margin-top: 0;
      font-family: 'Arial Black', Impact, sans-serif;
      margin-bottom: 25px;
      color: #b0005d;
    }

    .text-side p:last-of-type {
      font-size: 35px;  
      line-height: 1.4;
      font-family: 'Arial Black', Impact, sans-serif;
      margin-top: 0;
      margin-bottom: 30px;
      color: #3d0066;
    }

    .image-side {
      flex: 1.15;
    }

    .image-side img {
      width: 100%;
      height: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.75); 
      border-radius: 12px;
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <div class="text-side">
      <p>JUST WANTED TO SAY HAPPY BIRTHDAY</p>
      <p>and wish you many more</p>
    </div>
    <div class="image-side">
      <img src="Bday.png" alt="Happy Birthday Art">
    </div>
  </div>

</body>
</html>
